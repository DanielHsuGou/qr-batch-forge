<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Batch Forge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Animations */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.1), transparent);
            animation: scanline 3s linear infinite;
            pointer-events: none;
            z-index: 10;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .qr-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .qr-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border-color: #38bdf8;
        }

        /* Grid Background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }

        /* Button Glow */
        .glow-btn {
            position: relative;
            overflow: hidden;
        }
        .glow-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56,189,248,0.4) 0%, transparent 60%);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s, transform 0.3s;
        }
        .glow-btn:hover::after {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <!-- Background Grid -->
    <div class="absolute inset-0 bg-grid pointer-events-none z-0"></div>

    <!-- Header -->
    <header class="relative z-20 pt-8 pb-4 px-6 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-cyan-500 rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.5)]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">QR Batch <span class="text-cyan-400">Forge</span></h1>
                    <p class="text-xs text-slate-400 font-mono">MULTI-STRING GENERATION ENGINE</p>
                </div>
            </div>
            <div class="flex gap-4">
                <button onclick="app.downloadAll()" class="glow-btn hidden md:flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-900/50 rounded-md transition-colors text-sm font-semibold group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 group-hover:animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download All
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-6 z-10 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Input Section -->
        <div class="lg:col-span-4 flex flex-col gap-4">
            <div class="glass-panel rounded-xl p-1 flex flex-col h-full relative overflow-hidden group">
                <div class="scan-overlay opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                
                <div class="bg-slate-900/50 p-4 border-b border-slate-700/50 flex justify-between items-center">
                    <label class="text-sm font-semibold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                        Input Data
                    </label>
                    <span id="count-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700">0 items</span>
                </div>

                <div class="relative flex-1">
                    <textarea id="input-area" 
                        class="w-full h-96 lg:h-full bg-transparent text-slate-300 font-mono text-sm p-4 resize-none focus:outline-none placeholder-slate-600"
                        placeholder="Paste your strings here...&#10;One per line...&#10;&#10;Format: content,filename (filename optional)&#10;https://example.com,my-custom-name"></textarea>
                    
                    <!-- Floating Action Bar inside Textarea -->
                    <div class="absolute bottom-4 right-4 flex gap-2">
                        <button onclick="app.clearInput()" class="p-2 bg-slate-800/80 hover:bg-red-900/30 text-slate-400 hover:text-red-400 rounded-lg backdrop-blur-sm border border-slate-700 transition-all" title="Clear">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                        <button onclick="app.pasteClipboard()" class="p-2 bg-slate-800/80 hover:bg-cyan-900/30 text-slate-400 hover:text-cyan-400 rounded-lg backdrop-blur-sm border border-slate-700 transition-all" title="Paste">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="p-4 border-t border-slate-700/50 bg-slate-900/30 flex flex-col gap-3">
                    <!-- Logo Upload Section -->
                    <div class="flex items-center justify-between bg-slate-800/50 p-2 rounded-lg border border-slate-700/50">
                        <div class="flex items-center gap-2">
                            <label class="flex items-center gap-2 cursor-pointer bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition text-xs font-semibold text-slate-200">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                Center Image
                                <input type="file" id="logo-input" accept="image/*" class="hidden" onchange="app.handleLogoUpload(event)">
                            </label>
                            <span id="logo-status" class="text-xs text-slate-500">No image</span>
                        </div>
                        <button id="remove-logo-btn" class="hidden text-xs text-red-400 hover:text-red-300 px-2 py-1" onclick="app.removeLogo()">Remove</button>
                    </div>

                    <button onclick="app.generate()" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-lg shadow-lg shadow-cyan-500/20 transition-all transform active:scale-95 flex justify-center items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                        FORGE QR CODES
                    </button>
                </div>
            </div>
        </div>

        <!-- Output Section -->
        <div class="lg:col-span-8 flex flex-col h-full min-h-[500px]">
            <div class="glass-panel rounded-xl flex-1 flex flex-col overflow-hidden">
                <div class="bg-slate-900/50 p-4 border-b border-slate-700/50 flex justify-between items-center">
                    <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wider">Generated Output</h2>
                    <div class="flex gap-2">
                        <select id="size-select" onchange="app.regenerate()" class="bg-slate-800 text-xs text-slate-300 border border-slate-700 rounded px-2 py-1 focus:outline-none focus:border-cyan-500">
                            <option value="128">Size: Small</option>
                            <option value="200" selected>Size: Medium</option>
                            <option value="300">Size: Large</option>
                            <option value="400">Size: X-Large</option>
                        </select>
                    </div>
                </div>
                
                <!-- Grid Container -->
                <div id="output-grid" class="flex-1 overflow-y-auto p-6 bg-slate-900/20">
                    <!-- Empty State -->
                    <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-500 opacity-60">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mb-4 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                        </svg>
                        <p class="text-lg font-light">Ready to generate</p>
                        <p class="text-sm">Enter data on the left and click Forge</p>
                    </div>
                    
                    <!-- Actual Grid -->
                    <div id="qr-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden">
                        <!-- Cards injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Hidden container for QR generation processing -->
    <div id="qr-workspace" class="hidden"></div>

    <script>
        class QRForge {
            constructor() {
                this.inputArea = document.getElementById('input-area');
                this.outputGrid = document.getElementById('qr-grid');
                this.emptyState = document.getElementById('empty-state');
                this.countBadge = document.getElementById('count-badge');
                this.workspace = document.getElementById('qr-workspace');
                this.sizeSelect = document.getElementById('size-select');
                
                this.logoData = null;
                this.logoStatus = document.getElementById('logo-status');
                this.removeLogoBtn = document.getElementById('remove-logo-btn');
                
                this.qrCodes = []; // Store data for batch download
                
                // Event Listeners
                this.inputArea.addEventListener('input', () => this.updateCount());
            }

            updateCount() {
                const lines = this.inputArea.value.split('\n').filter(line => line.trim() !== '');
                this.countBadge.textContent = `${lines.length} item${lines.length !== 1 ? 's' : ''}`;
                
                // Visual feedback on badge
                this.countBadge.classList.remove('bg-slate-800');
                this.countBadge.classList.add('bg-cyan-900/50', 'text-cyan-300', 'border-cyan-800');
                setTimeout(() => {
                    this.countBadge.classList.remove('bg-cyan-900/50', 'text-cyan-300', 'border-cyan-800');
                    this.countBadge.classList.add('bg-slate-800');
                }, 300);
            }

            async pasteClipboard() {
                try {
                    const text = await navigator.clipboard.readText();
                    this.inputArea.value = text;
                    this.updateCount();
                    // Flash effect
                    this.inputArea.classList.add('bg-cyan-900/10');
                    setTimeout(() => this.inputArea.classList.remove('bg-cyan-900/10'), 200);
                } catch (err) {
                    console.error('Failed to read clipboard', err);
                    alert('Could not access clipboard. Please paste manually.');
                }
            }

            clearInput() {
                this.inputArea.value = '';
                this.updateCount();
                this.inputArea.focus();
            }

            handleLogoUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.logoData = e.target.result;
                    this.logoStatus.textContent = file.name;
                    this.logoStatus.classList.add('text-cyan-400');
                    this.removeLogoBtn.classList.remove('hidden');
                    
                    // Regenerate if existing codes exist
                    if (this.qrCodes.length > 0) {
                        this.generate();
                    }
                };
                reader.readAsDataURL(file);
            }

            removeLogo() {
                this.logoData = null;
                document.getElementById('logo-input').value = '';
                this.logoStatus.textContent = 'No image';
                this.logoStatus.classList.remove('text-cyan-400');
                this.removeLogoBtn.classList.add('hidden');
                
                if (this.qrCodes.length > 0) {
                    this.generate();
                }
            }

            regenerate() {
                if (this.qrCodes.length > 0) {
                    this.generate();
                }
            }

            generate() {
                const rawText = this.inputArea.value;
                if (!rawText.trim()) return;

                const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== '');
                
                // UI Updates
                this.emptyState.classList.add('hidden');
                this.outputGrid.classList.remove('hidden');
                this.outputGrid.innerHTML = ''; // Clear previous
                this.qrCodes = []; // Reset storage

                const size = parseInt(this.sizeSelect.value);

                lines.forEach((line, index) => {
                    // Parse content and filename
                    const parts = line.split(',');
                    const contentText = parts[0].trim();
                    const filenameText = parts.length > 1 ? parts.slice(1).join(',').trim() : '';
                    
                    const cardId = `qr-card-${index}`;
                    const canvasId = `qr-canvas-${index}`;
                    
                    const card = document.createElement('div');
                    card.className = 'qr-card glass-panel rounded-lg p-4 flex flex-col items-center gap-3 border border-slate-700/50 relative group animate-fade-in-up';
                    card.style.animationDelay = `${index * 50}ms`;
                    
                    const filenameDisplay = filenameText || 'Auto-generated';

                    // Generate Card UI
                    card.innerHTML = `
                        <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700">#${index + 1}</span>
                        </div>
                        <div class="bg-white p-2 rounded shadow-inner relative flex justify-center items-center" style="width: ${size + 16}px; height: ${size + 16}px;">
                            <div id="${canvasId}"></div>
                            ${this.logoData ? `<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-1 rounded z-10" style="width: ${size * 0.15 + 8}px; height: ${size * 0.15 + 8}px;"><img src="${this.logoData}" class="w-full h-full object-contain"></div>` : ''}
                        </div>
                        <div class="w-full flex flex-col items-center">
                            <p class="text-xs text-slate-400 mb-1 font-mono truncate w-full text-center" title="${this.escapeHtml(contentText)}">content: ${this.escapeHtml(contentText)}</p>
                            <p class="text-[10px] text-slate-500 mb-2 font-mono truncate w-full text-center" title="${this.escapeHtml(filenameDisplay)}">filename: ${this.escapeHtml(filenameDisplay)}</p>
                            <button class="w-full py-1.5 bg-slate-800 hover:bg-cyan-600 hover:text-white text-slate-300 text-xs rounded border border-slate-700 transition-colors flex items-center justify-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                Download
                            </button>
                        </div>
                    `;
                    
                    // Attach event listener directly to avoid quote escaping issues
                    card.querySelector('button').onclick = () => this.downloadSingle(contentText, filenameText);
                    this.outputGrid.appendChild(card);

                    // Generate QR
                    // We use a slight timeout to allow the DOM to paint and prevent UI freezing on huge batches
                    setTimeout(() => {
                        try {
                            new QRCode(document.getElementById(canvasId), {
                                text: contentText,
                                width: size,
                                height: size,
                                colorDark : "#000000",
                                colorLight : "#ffffff",
                                correctLevel : QRCode.CorrectLevel.H
                            });
                            
                            // Store for batch download
                            this.qrCodes.push({
                                id: canvasId,
                                text: contentText,
                                customFilename: filenameText
                            });

                        } catch (e) {
                            console.error("QR Generation failed for:", contentText, e);
                        }
                    }, index * 10); 
                });
            }

            escapeHtml(text) {
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            generateFilename(text) {
                let filename = text.replace(/^https?:\/\//, '')
                                 .replace(/[^a-zA-Z0-9\-_]/g, '-')
                                 .replace(/-+/g, '-')
                                 .replace(/^-|-$/g, '');
                if (filename.length > 50) {
                    filename = filename.substring(0, 50);
                }
                return filename || 'qrcode';
            }

            // Helper to create high-res canvas for downloads (includes white space and logo)
            getDownloadDataUrl(text) {
                return new Promise((resolve) => {
                    const QR_SIZE = 370; 
                    const WHITE_SPACE = 20;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.style.position = 'absolute';
                    tempDiv.style.left = '-9999px';
                    document.body.appendChild(tempDiv);
                    
                    new QRCode(tempDiv, {
                        text: text,
                        width: QR_SIZE - (WHITE_SPACE * 2),
                        height: QR_SIZE - (WHITE_SPACE * 2),
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = QR_SIZE;
                        canvas.height = QR_SIZE;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, QR_SIZE, QR_SIZE);
                        
                        const qrCanvas = tempDiv.querySelector('canvas');
                        ctx.drawImage(qrCanvas, WHITE_SPACE, WHITE_SPACE, QR_SIZE - (WHITE_SPACE * 2), QR_SIZE - (WHITE_SPACE * 2));
                        
                        if (this.logoData) {
                            const logoImg = new Image();
                            logoImg.onload = () => {
                                const logoSize = (QR_SIZE - (WHITE_SPACE * 2)) * 0.15;
                                const logoX = (QR_SIZE - logoSize) / 2;
                                const logoY = (QR_SIZE - logoSize) / 2;
                                
                                ctx.fillStyle = '#ffffff';
                                ctx.fillRect(logoX - 2, logoY - 2, logoSize + 4, logoSize + 4);
                                ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
                                
                                document.body.removeChild(tempDiv);
                                resolve(canvas.toDataURL("image/png"));
                            };
                            logoImg.src = this.logoData;
                        } else {
                            document.body.removeChild(tempDiv);
                            resolve(canvas.toDataURL("image/png"));
                        }
                    }, 100);
                });
            }

            async downloadSingle(text, customFilename) {
                const dataUrl = await this.getDownloadDataUrl(text);
                const link = document.createElement('a');
                
                const filename = customFilename || this.generateFilename(text);
                link.download = `${filename}.png`;
                link.href = dataUrl;
                link.click();
            }

            async downloadAll() {
                if (this.qrCodes.length === 0) return;

                // Check if JSZip is available, if not load it dynamically
                if (typeof JSZip === 'undefined') {
                    await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
                }
                
                // Check for FileSaver
                if (typeof saveAs === 'undefined') {
                    await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js');
                }

                const zip = new JSZip();
                const folder = zip.folder("qr_codes");

                for (let i = 0; i < this.qrCodes.length; i++) {
                    const item = this.qrCodes[i];
                    
                    // Generate high-res data URL
                    const dataUrl = await this.getDownloadDataUrl(item.text);
                    const base64 = dataUrl.split(',')[1];
                    
                    // Determine filename
                    let filename = item.customFilename || this.generateFilename(item.text);
                    // Sanitize lightly to avoid illegal path characters just in case
                    filename = filename.replace(/[\\/:*?"<>|]/g, '_');
                    
                    folder.file(`${filename}.png`, base64, {base64: true});
                }

                zip.generateAsync({type:"blob"}).then(function(content) {
                    saveAs(content, "qr_codes_batch.zip");
                });
            }

            loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
        }

        // Initialize
        const app = new QRForge();

        // Add simple CSS animation for cards
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.5s ease-out forwards;
                opacity: 0; 
            }
        `;
        document.head.appendChild(style);

    </script>
